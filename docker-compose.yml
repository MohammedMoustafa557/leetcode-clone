services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leetcode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leetcode}
      POSTGRES_DB: ${POSTGRES_DB:-leetcode}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leetcode}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leetcode}:${POSTGRES_PASSWORD:-leetcode}@db:5432/${POSTGRES_DB:-leetcode}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SEED_ON_START: ${SEED_ON_START:-true}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      CONTEST_FIRST_DATE: ${CONTEST_FIRST_DATE:-2026-01-02}
      CONTEST_START_UTC: ${CONTEST_START_UTC:-16:00}
      CONTEST_MINUTES: ${CONTEST_MINUTES:-90}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_DATABASE_ID: ${NOTION_DATABASE_ID:-}
      NOTION_SYNC_USERNAME: ${NOTION_SYNC_USERNAME:-}
    volumes:
      - seed-cache:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_PYODIDE_URL: ${VITE_PYODIDE_URL:-}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  seed-cache:
